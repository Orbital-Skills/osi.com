<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Portal | OSD</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --theme-purple: #6a1b9a;
            --theme-bg: #f4f4f4;
            --text-color: #333;
            --success-color: #2e7d32;
            --error-color: #d32f2f;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(to bottom, #7b1fa2 40%, #f5f5f5 40%);
            min-height: 100vh;
            margin: 0; padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 100px;
        }

        .card-container {
            background: white;
            width: 90%;
            max-width: 850px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            margin-bottom: 50px;
        }

        .floating-logo-container {
            position: absolute;
            top: 0; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border: 4px solid white;
        }

        .floating-logo-container img {
            width: 220px;
            height: auto;
        }

        .tabs-header {
            display: flex;
            width: 100%;
            height: 60px;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        .tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .tab-inactive { background-color: white; color: red; border-bottom: 1px solid #ddd; }
        .tab-inactive:hover { background-color: #e0e0e0; }
        .tab-active { background-color: green; color: white; }

        .tab-content {
            padding: 40px;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/Orbital-Skills/osi.com/main/LOGO.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            display: none;
        }
        
         /* Watermark Overlay Hack to make it faded */
        .tab-content::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92); /* Covers the logo to make it faint */
            z-index: 1;

        }

        .form-area { position: relative; z-index: 2; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        .input-group { margin-bottom: 20px; position: relative; }
        
        .input-group label {
            display: block; color: #444; font-weight: 700; font-size: 14px; margin-bottom: 8px;
        }
        .input-group label span { color: #d32f2f; }

        .input-group input {
            width: 100%; padding: 12px 15px; font-size: 15px;
            border: 1px solid #ccc; border-radius: 4px;
            background: #fdfdfd; box-sizing: border-box; transition: 0.2s;
        }

        .input-group input:focus {
            outline: none; border-color: var(--theme-purple);
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.1);
        }
        
        /* Validation Styles */
        .input-group input.valid { border-color: var(--success-color); background: #e8f5e9; }
        .input-group input.invalid { border-color: var(--error-color); background: #ffebee; }

        .field-msg {
            font-size: 12px; font-weight: 600; margin-top: 4px; display: block; min-height: 18px;
        }
        .msg-success { color: var(--success-color); }
        .msg-error { color: var(--error-color); }
        .checking { color: #f57c00; }

        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        @media(max-width: 600px) { .row { flex-direction: column; gap: 0; } }

        .verify-btn {
            background: linear-gradient(to right, #7b1fa2, #9c27b0);
            color: white; border: none; width: 100%; padding: 15px;
            font-size: 16px; font-weight: 800; text-transform: uppercase;
            border-radius: 5px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s; margin-top: 10px;
            opacity: 0.5; pointer-events: none; /* Disabled initially */
        }
        .verify-btn.active-btn {
            opacity: 1; pointer-events: all; cursor: pointer;
        }
        .verify-btn:hover { transform: translateY(-2px); }

        .result-box {
            display: none; margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; text-align: center;
        }
        .success-badge {
            background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 4px;
            font-weight: bold; margin-bottom: 20px; display: inline-block; width: 100%; box-sizing: border-box;
        }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .data-lbl { font-weight: 600; color: #555; width: 40%; }
        .data-val { font-weight: 700; color: #000; }

        @keyframes fadeIn { from{opacity:0; transform: translateY(5px);} to{opacity:1; transform: translateY(0);} }

        .loader { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100;
            color: white; text-align: center; padding-top: 40vh; font-size: 20px;
        }
/* Academic Record Table - New Design */
.academic-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    border: 2px solid #6a1b9a; /* गहरा पर्पल बॉर्डर */
}

.academic-table th {
    background-color: white;
    color: #6a1b9a;
    padding: 12px;
    border: 1px solid #6a1b9a;
    text-align: center;
    font-size: 15px;
}

.academic-table td {
    padding: 10px;
    border: 1px solid #6a1b9a;
    text-align: center;
    color: #6a1b9a; /* टेक्स्ट का रंग पर्पल */
    font-weight: 500;
}

.sub-name { text-align: left !important; padding-left: 15px !important; }
.max-marks { color: red; } /* Maximum Marks लाल रंग में */

.grand-total-row {
    font-weight: bold;
    background-color: #f9f9f9;
}
.grand-total-lbl { color: green; font-size: 18px; }
    </style>
</head>
<body>

    <div id="loader-overlay" class="loader">
        <i class="fas fa-spinner fa-spin"></i> Loading...
    </div>

    <div class="card-container">
        <div class="floating-logo-container">
            <img src="https://raw.githubusercontent.com/Orbital-Skills/osi.com/main/LOGO.png" alt="OSD Logo">
        </div>

        <div class="tabs-header">
            <div class="tab tab-inactive" onclick="switchTab('qr')">
                <i class="fas fa-qrcode" style="margin-right: 8px;"></i> QR-Code Verification
            </div>
            <div class="tab tab-active" onclick="switchTab('manual')">
                <i class="fas fa-file-alt" style="margin-right: 8px;"></i> Certificate Verification
            </div>
        </div>

         <!-- QR CONTENT (Hidden initially for demo purposes, based on screenshot showing Manual open) -->
        <div id="qr-tab" class="tab-content">
    <div class="form-area" style="text-align: center;">
        <h3 style="color:#555;">Scan QR Code</h3>
        <p>Use your camera to scan the QR code on the certificate.</p>
        
        <div id="reader" style="width: 100%; max-width: 400px; margin: 10px auto; height: 0; overflow: hidden; border: 2px solid #6a1b9a; border-radius: 10px;"></div>

        <button id="open-scanner-btn" onclick="startQRScanner()" class="verify-btn active-btn" style="background:#455a64;">
            <i class="fas fa-camera"></i> OPEN SCANNER
        </button>
    </div>
</div>


        <div id="manual-tab" class="tab-content active">
            <div class="form-area">
                
                <div id="input-section">
                    <!-- Step 1: Roll No Verification -->
                    <div class="input-group">
                        <label>Enter Roll / Registration No <span>*</span></label>
                        <!-- Added onblur event to fetch data -->
                        <input type="text" id="v-roll" placeholder="Ex: 260300001" onblur="fetchRollData()">
                        <small id="msg-roll" class="field-msg"></small>
                    </div>

                    <!-- Step 2: Other Details (Initially Disabled) -->
                    <div id="details-section" style="opacity: 0.5; pointer-events: none;">
                        <div class="row">
                            <div class="col input-group">
                                <label>Student Name</label>
                                <input type="text" id="v-name" placeholder="Full Name" onkeyup="validateField(this, 'name')" disabled>
                                <small id="msg-name" class="field-msg"></small>
                            </div>
                            <div class="col input-group">
                                <label>Father's Name</label>
                                <input type="text" id="v-father" placeholder="Father Name" onkeyup="validateField(this, 'father')" disabled>
                                <small id="msg-father" class="field-msg"></small>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col input-group">
                                <label>Mother's Name</label>
                                <input type="text" id="v-mother" placeholder="Mother Name" onkeyup="validateField(this, 'mother')" disabled>
                                <small id="msg-mother" class="field-msg"></small>
                            </div>
                            <div class="col input-group">
                                <label>Course Name</label>
                                <input type="text" id="v-course" placeholder="Applied Course" onkeyup="validateField(this, 'course')" disabled>
                                <small id="msg-course" class="field-msg"></small>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button (Enabled only when all fields match) -->
                    <button id="main-btn" class="verify-btn" onclick="showFinalResult()">
                        VERIFY RECORD <i class="fas fa-arrow-right" style="margin-left:5px;"></i>
                    </button>
                </div>

                <!-- RESULTS DISPLAY -->
                <div id="result-display" class="result-box">
                    <div class="success-badge">
                        <i class="fas fa-check-circle"></i> VERIFIED STUDENT RECORD
                    </div>
                    
                    <div style="display: flex; flex-direction: column; align-items: center; gap: 15px;">
                        <img id="res-photo" src="" style="width: 100px; height: 120px; object-fit: cover; border: 3px solid #ddd; padding: 2px;">
                        
                        <table class="data-table">
                            <tr><td class="data-lbl">Roll No:</td><td class="data-val" id="res-roll"></td></tr>
                            <tr><td class="data-lbl">Name:</td><td class="data-val" id="res-name"></td></tr>
                            <tr><td class="data-lbl">Father Name:</td><td class="data-val" id="res-father"></td></tr>
                            <tr><td class="data-lbl">Mother Name:</td><td class="data-val" id="res-mother"></td></tr>
                            <tr><td class="data-lbl">Course:</td><td class="data-val" id="res-course"></td></tr>
                            <tr><td class="data-lbl">Status:</td><td class="data-val" style="color:green;">PASS</td></tr>
                        </table>

<h3 style="color: #6a1b9a; margin-top: 30px; text-decoration: underline; text-align:center;">Academic Record</h3>

<table class="academic-table" style="width: 100%; border-collapse: collapse; border: 2px solid #6a1b9a;">
    <thead>
        <tr style="background-color: white;">
            <th style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a;">Subject</th>
            <th style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a;">Maximum Marks</th>
            <th style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a;">Marks Obtained</th>
            <th style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a;">Grade</th>
        </tr>
    </thead>
    <tbody id="marks-body-final">
        </tbody>
    <tfoot>
        <tr style="font-weight: bold; background-color: white;">
            <td style="border: 1px solid #6a1b9a; padding: 10px; color: green; text-align: left;">Grand Total</td>
            <td style="border: 1px solid #6a1b9a; padding: 10px; color: red; text-align: center;">800</td>
            <td id="res-total-final" style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a; text-align: center;"></td>
            <td id="res-grade-final" style="border: 1px solid #6a1b9a; padding: 10px; color: #6a1b9a; text-align: center;"></td>
        </tr>
    </tfoot>
</table>
</div>
                    
                    <button onclick="location.reload()" style="margin-top:20px; background:transparent; border:none; color: #6a1b9a; text-decoration: underline; cursor:pointer;">
                        Verify Another Student
                    </button>
                </div>

            </div>
        </div>

    </div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNZgD1IP1BUB7R8XyHTDZP1faQfr-ETJj6n005_ze9pT1D1BofuFBanQWEcmf_G2Dn/exec"; 

let fetchedData = null;
let isQRMode = false;
let matched = { name:false, father:false, mother:false, course:false };


// ---------------- TAB SWITCH ----------------
function switchTab(type){
    document.getElementById("qr-tab").classList.remove("active");
    document.getElementById("manual-tab").classList.remove("active");

    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("tab-active"));
    document.querySelectorAll(".tab").forEach(t=>t.classList.add("tab-inactive"));

    if(type==="qr"){
        document.getElementById("qr-tab").classList.add("active");
        document.querySelectorAll(".tab")[0].classList.add("tab-active");
    }else{
        document.getElementById("manual-tab").classList.add("active");
        document.querySelectorAll(".tab")[1].classList.add("tab-active");
    }
}

// ---------------- FETCH ----------------
async function autoFetchQRResult(sid){
    if(!sid) return;

    document.getElementById("msg-roll").innerHTML = "Checking database...";
    document.getElementById("msg-roll").className = "field-msg checking";

    try{
        const res = await fetch(`${SCRIPT_URL}?Action=VERIFY&RollNo=${encodeURIComponent(sid)}`);
        const json = await res.json();

        if(json.Success){
            fetchedData = json.Data;
            document.getElementById("msg-roll").innerHTML = "Record Found";
            document.getElementById("msg-roll").className = "field-msg msg-success";

            if(isQRMode){
                showFinalResult();   // QR = direct
            }else{
                // पूरा सेक्शन enable
                const section = document.getElementById("details-section");
                section.style.opacity = "1";
                section.style.pointerEvents = "all";

                // चारों input enable
                document.getElementById("v-name").removeAttribute("disabled");
                document.getElementById("v-father").removeAttribute("disabled");
                document.getElementById("v-mother").removeAttribute("disabled");
                document.getElementById("v-course").removeAttribute("disabled");
            }

        }else{
            document.getElementById("msg-roll").innerHTML = "Record Not Found";
            document.getElementById("msg-roll").className = "field-msg msg-error";
        }

    }catch(e){
        alert("Server Error");
    }
}


// ---------------- MANUAL ----------------
function fetchRollData(){
    isQRMode = false;
    autoFetchQRResult(document.getElementById("v-roll").value.trim());
}
function enableManualFields() {
    const section = document.getElementById("details-section");
    section.style.opacity = "1";
    section.style.pointerEvents = "all";

    document.getElementById("v-name").disabled = false;
    document.getElementById("v-father").disabled = false;
    document.getElementById("v-mother").disabled = false;
    document.getElementById("v-course").disabled = false;
}
// ---------------- FIELD VALIDATION ----------------
function validateField(input, type){
    if(!fetchedData) return;

    let real = fetchedData[type.charAt(0).toUpperCase()+type.slice(1)];

    if(input.value.trim().toLowerCase() === real.toLowerCase()){
        input.classList.add("valid");
        input.classList.remove("invalid");
        matched[type] = true;
    } else {
        input.classList.add("invalid");
        input.classList.remove("valid");
        matched[type] = false;
    }

    if(matched.name && matched.father && matched.mother && matched.course){
        document.getElementById("main-btn").classList.add("active-btn");
    } else {
        document.getElementById("main-btn").classList.remove("active-btn");
    }
}


// ---------------- RESULT ----------------
function showFinalResult(){
    document.getElementById("input-section").style.display="none";
    document.getElementById("result-display").style.display="block";

    document.getElementById("res-roll").innerText = fetchedData.Roll;
    document.getElementById("res-name").innerText = fetchedData.Name;
    document.getElementById("res-father").innerText = fetchedData.Father;
    document.getElementById("res-mother").innerText = fetchedData.Mother;
    document.getElementById("res-course").innerText = fetchedData.Course;

    let html="";
    for(let i=1;i<=8;i++){
        if(fetchedData["Sub"+i]){
            html+=`<tr>
            <td class="sub-name">${fetchedData["Sub"+i]}</td>
            <td class="max-marks">100</td>
            <td>${fetchedData["Mark"+i]}</td>
            <td>${fetchedData.Grade}</td>
            </tr>`;
        }
    }
    document.getElementById("marks-body-final").innerHTML=html;
    document.getElementById("res-total-final").innerText=fetchedData.Total;
    document.getElementById("res-grade-final").innerText=fetchedData.Grade;

    if(fetchedData.Photo){
        document.getElementById("res-photo").src =
        fetchedData.Photo.includes("id=")
        ? "https://drive.google.com/thumbnail?id="+fetchedData.Photo.split("id=")[1]
        : fetchedData.Photo;
    }
}

    // ---------------- QR ----------------
let html5QrCode = null;

function startQRScanner() {
    isQRMode = true;
    switchTab("qr");

    const readerDiv = document.getElementById("reader");
    readerDiv.style.height = "300px";   // scanner दिखाओ

    if (html5QrCode) {
        html5QrCode.stop().catch(()=>{});
    }

    html5QrCode = new Html5Qrcode("reader");

    html5QrCode.start(
        { facingMode: { exact: "environment" } },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
            html5QrCode.stop().then(() => {
                readerDiv.style.height = "0px"; // scanner बंद

                switchTab("manual"); // result manual tab में दिखाओ

                try {
                    const url = new URL(decodedText);
                    const sid = url.searchParams.get("StudentID") ||
                                url.searchParams.get("RollNo") ||
                                url.searchParams.get("roll");

                    autoFetchQRResult(sid || decodedText);
                } catch {
                    autoFetchQRResult(decodedText);
                }
            });
        }
    );
}


// Enable manual block
function enableManualFields() {
    // पूरा ब्लॉक activate करो
    const section = document.getElementById("details-section");
    section.style.opacity = "1";
    section.style.pointerEvents = "auto";

    // चारों inputs से disabled हटाओ
    const inputs = ["v-name", "v-father", "v-mother", "v-course"];
    inputs.forEach(id => {
        const el = document.getElementById(id);
        el.removeAttribute("disabled");
    });
}
window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    const sid = params.get("StudentID") || params.get("RollNo") || params.get("roll");

    if (sid) {
        isQRMode = true;          // Direct mode
        autoFetchQRResult(sid);  // अपने आप verify
    }
};

</script>

</body>
</html>
