<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Portal | OSD</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --theme-purple: #6a1b9a;
            --theme-bg: #f4f4f4;
            --text-color: #333;
            --success-color: #2e7d32;
            --error-color: #d32f2f;
        }

        body {
            font-family: 'Open Sans', sans-serif;
            background: linear-gradient(to bottom, #7b1fa2 40%, #f5f5f5 40%);
            min-height: 100vh;
            margin: 0; padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 100px;
        }

        .card-container {
            background: white;
            width: 90%;
            max-width: 850px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            margin-bottom: 50px;
        }

        .floating-logo-container {
            position: absolute;
            top: 0; left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border: 4px solid white;
        }

        .floating-logo-container img {
            width: 220px;
            height: auto;
        }

        .tabs-header {
            display: flex;
            width: 100%;
            height: 60px;
            overflow: hidden;
            border-radius: 8px 8px 0 0;
        }

        .tab {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;

        .tab-inactive { background-color: white; color: red; border-bottom: 1px solid #ddd; }
        .tab-inactive:hover { background-color: #e0e0e0; }
        .tab-active { background-color: green; color: white; }

        .tab-content {
            padding: 40px;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/Orbital-Skills/osi.com/main/LOGO.png'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: 500px;
            display: none;
        }
        
         /* Watermark Overlay Hack to make it faded */
        .tab-content::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.92); /* Covers the logo to make it faint */
            z-index: 1;

        }

        .form-area { position: relative; z-index: 2; }
        .tab-content.active { display: block; animation: fadeIn 0.3s; }

        .input-group { margin-bottom: 20px; position: relative; }
        
        .input-group label {
            display: block; color: #444; font-weight: 700; font-size: 14px; margin-bottom: 8px;
        }
        .input-group label span { color: #d32f2f; }

        .input-group input {
            width: 100%; padding: 12px 15px; font-size: 15px;
            border: 1px solid #ccc; border-radius: 4px;
            background: #fdfdfd; box-sizing: border-box; transition: 0.2s;
        }

        .input-group input:focus {
            outline: none; border-color: var(--theme-purple);
            box-shadow: 0 0 0 3px rgba(106, 27, 154, 0.1);
        }
        
        /* Validation Styles */
        .input-group input.valid { border-color: var(--success-color); background: #e8f5e9; }
        .input-group input.invalid { border-color: var(--error-color); background: #ffebee; }

        .field-msg {
            font-size: 12px; font-weight: 600; margin-top: 4px; display: block; min-height: 18px;
        }
        .msg-success { color: var(--success-color); }
        .msg-error { color: var(--error-color); }
        .checking { color: #f57c00; }

        .row { display: flex; gap: 20px; }
        .col { flex: 1; }
        @media(max-width: 600px) { .row { flex-direction: column; gap: 0; } }

        .verify-btn {
            background: linear-gradient(to right, #7b1fa2, #9c27b0);
            color: white; border: none; width: 100%; padding: 15px;
            font-size: 16px; font-weight: 800; text-transform: uppercase;
            border-radius: 5px; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.2s; margin-top: 10px;
            opacity: 0.5; pointer-events: none; /* Disabled initially */
        }
        .verify-btn.active-btn {
            opacity: 1; pointer-events: all; cursor: pointer;
        }
        .verify-btn:hover { transform: translateY(-2px); }

        .result-box {
            display: none; margin-top: 30px; border-top: 2px dashed #ddd; padding-top: 20px; text-align: center;
        }
        .success-badge {
            background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 4px;
            font-weight: bold; margin-bottom: 20px; display: inline-block; width: 100%; box-sizing: border-box;
        }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table td { padding: 10px; border-bottom: 1px solid #eee; }
        .data-lbl { font-weight: 600; color: #555; width: 40%; }
        .data-val { font-weight: 700; color: #000; }

        @keyframes fadeIn { from{opacity:0; transform: translateY(5px);} to{opacity:1; transform: translateY(0);} }

        .loader { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 100;
            color: white; text-align: center; padding-top: 40vh; font-size: 20px;
        }
/* Academic Record Table - New Design */

    </style>
</head>

   <script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlUjEgOJhqnHm9b8oiXMf4fS4qf_rd7rCs6s_wdIx6RQL5iGclqVROtqnm6Ot7-zlh/exec"; 
let fetchedData = null;

  // Tabs Logic
        function switchTab(mode) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            
            // Remove active classes
            tabs[0].classList.remove('tab-active'); tabs[0].classList.add('tab-inactive');
            tabs[1].classList.remove('tab-active'); tabs[1].classList.add('tab-inactive');
            contents[0].classList.remove('active');
            contents[1].classList.remove('active');

            if(mode === 'qr') {
                tabs[0].classList.add('tab-active'); tabs[0].classList.remove('tab-inactive');
                contents[0].classList.add('active');
            } else {
                tabs[1].classList.add('tab-active'); tabs[1].classList.remove('tab-inactive');
                contents[1].classList.add('active');
            }
        }


// ---------------- FETCH DATA ----------------
async function fetchRollData() {
    const rollInput = document.getElementById('v-roll');
    const msgBox = document.getElementById('msg-roll');
    const roll = rollInput.value.trim();

    if(!roll) return;

    msgBox.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking Database...';
    msgBox.className = "field-msg checking";
    rollInput.disabled = true;

    try {
        const finalUrl = SCRIPT_URL + "?roll=" + encodeURIComponent(roll);
        const response = await fetch(finalUrl);
        const data = await response.json();

        if(data.Success) {
            fetchedData = data.Data;
            msgBox.innerHTML = '<i class="fas fa-check"></i> Record Found';
            msgBox.className = "field-msg msg-success";
            rollInput.classList.add('valid');

            document.getElementById('details-section').style.opacity = "1";
            document.getElementById('details-section').style.pointerEvents = "all";
            document.getElementById('v-name').disabled = false;
            document.getElementById('v-father').disabled = false;
            document.getElementById('v-mother').disabled = false;
            document.getElementById('v-course').disabled = false;

            
        } else {
            throw "Not Found";
        }
    } catch (e) {
        msgBox.innerHTML = '<i class="fas fa-times"></i> Record Not Found / Script Error';
        msgBox.className = "field-msg msg-error";
        rollInput.disabled = false;
        rollInput.classList.add('invalid');
    }
}

// ---------------- SHOW RESULT ----------------
function showFinalResult() {
    if (!fetchedData) return;

    document.getElementById('input-section').style.display = "none";
    document.getElementById('result-display').style.display = "block";

    // ऊपरी जानकारी
    document.getElementById('res-roll').innerText = fetchedData.Roll || "";
    document.getElementById('res-name').innerText = fetchedData.Name || "";
    document.getElementById('res-father').innerText = fetchedData.Father || "";
    document.getElementById('res-mother').innerText = fetchedData.Mother || "";
    document.getElementById('res-course').innerText = fetchedData.Course || "";

    // नई टेबल में डेटा भरने का लॉजिक
    let marksHtml = "";
    for(let i = 1; i <= 8; i++) {
        let subName = fetchedData["Sub" + i];
        let subMark = fetchedData["Mark" + i];
        
        if(subName && subName.trim() !== "") {
            marksHtml += `
                <tr>
                    <td style="text-align: left; padding-left: 15px; border: 1px solid #6a1b9a; color: #6a1b9a; font-weight: 600;">${subName}</td>
                    <td style="color: red; text-align: center; border: 1px solid #6a1b9a; font-weight: 600;">100</td>
                    <td style="color: #6a1b9a; text-align: center; border: 1px solid #6a1b9a; font-weight: 600;">${subMark}</td>
                    <td style="color: #6a1b9a; text-align: center; border: 1px solid #6a1b9a; font-weight: 600;">${fetchedData.Grade || ""}</td>
                </tr>`;
        }
    }
    
    // डेटा को टेबल में सेट करना
    document.getElementById('marks-body-final').innerHTML = marksHtml;
    document.getElementById('res-total-final').innerText = fetchedData.Total || "0";
    document.getElementById('res-grade-final').innerText = fetchedData.Grade || "";

    // फोटो सेट करना
    if (fetchedData.Photo) {
        const img = document.getElementById('res-photo');
        img.src = fetchedData.Photo.includes("id=") ? 
                  "https://drive.google.com/thumbnail?id=" + fetchedData.Photo.split("id=")[1].split("&")[0] : 
                  fetchedData.Photo;
    }
}
// ---------------- QR & AUTO VERIFY LOGIC ----------------

window.onload = function () {
    const params = new URLSearchParams(window.location.search);
    const action = params.get("Action");
    const studentID = params.get("StudentID") || params.get("id");

    if (studentID) {
        // इनपुट बॉक्स में ID भर दें
        document.getElementById("v-roll").value = studentID;
        
        // अगर QR से आया है (Action=VERIFY), तो सीधा रिजल्ट दिखाएं
        if (action === "VERIFY") {
            autoFetchQRResult(studentID);
        } else {
            // वरना नॉर्मल तरीके से डेटा लोड करें (User को नाम/पिता का नाम मैच करना होगा)
            fetchRollData();
        }
    }
};

// QR स्कैन के लिए स्पेशल फंक्शन (Direct Result)
async function autoFetchQRResult(sid) {
    showLoading(true);
    try {
        const response = await fetch(`${SCRIPT_URL}?Action=VERIFY&StudentID=${sid}`);
        const result = await response.json();
        
        if (result.Success) {
            fetchedData = result.Data;
            // सीधे मार्कशीट (Professional Table) दिखाएं
            showFinalResult(); 
        } else {
            alert("QR Record not found!");
        }
    } catch (e) {
        alert("Verification Error!");
    } finally {
        showLoading(false);
    }
}

// बाकी के पुराने फंक्शन्स (मैचिंग के लिए)
function validateField(input, fieldKey) {
    if (!fetchedData) return;
    const userVal = input.value.trim().toLowerCase();
    const key = fieldKey.toLowerCase();
    let dbVal = "";
    if (key === "name") dbVal = fetchedData.Name;
    if (key === "father") dbVal = fetchedData.Father;
    if (key === "mother") dbVal = fetchedData.Mother;
    if (key === "course") dbVal = fetchedData.Course;

    const correctVal = (dbVal || "").toString().trim().toLowerCase();
    const msgBox = document.getElementById("msg-" + key);

    if (userVal === "") {
        input.classList.remove("valid", "invalid");
        msgBox.innerHTML = "";
        return;
    }
    if (userVal === correctVal) {
        input.classList.add("valid");
        input.classList.remove("invalid");
        msgBox.innerHTML = "✔ Match";
        msgBox.className = "field-msg msg-success";
    } else {
        input.classList.add("invalid");
        input.classList.remove("valid");
        msgBox.innerHTML = "✖ Incorrect";
        msgBox.className = "field-msg msg-error";
    }
    checkAllFields();
}

function checkAllFields() {
    const nameOk   = document.getElementById('v-name').classList.contains('valid');
    const fatherOk = document.getElementById('v-father').classList.contains('valid');
    const motherOk = document.getElementById('v-mother').classList.contains('valid');
    const courseOk = document.getElementById('v-course').classList.contains('valid');
    const btn = document.getElementById('main-btn');

    if (nameOk && fatherOk && motherOk && courseOk) {
        btn.disabled = false;
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
    } else {
        btn.disabled = true;
        btn.style.opacity = "0.5";
        btn.style.pointerEvents = "none";
    }
}
// 1. कैमरा शुरू करने का फंक्शन
function startQRScanner() {
    const readerDiv = document.getElementById('reader');
    const scanBtn = document.getElementById('open-scanner-btn'); // बटन की ID

    // बटन को थोड़ा धुंधला करें ताकि पता चले कि प्रोसेस शुरू हो गया है
    if(scanBtn) {
        scanBtn.style.opacity = "0.5";
        scanBtn.style.pointerEvents = "none";
    }

    readerDiv.style.display = 'block';
    const html5QrCode = new Html5Qrcode("reader");

    const qrCodeSuccessCallback = (decodedText) => {
        html5QrCode.stop().then(() => {
            readerDiv.style.display = 'none';
            
            // बटन को वापस चालू (Enable) करें
            if(scanBtn) {
                scanBtn.style.opacity = "1";
                scanBtn.style.pointerEvents = "auto";
            }
            
            try {
                const url = new URL(decodedText);
                const studentID = url.searchParams.get("StudentID");
                
                if (studentID) {
                    autoFetchQRResult(studentID); // डेटा लाकर टेबल दिखाएगा
                } else {
                    alert("इस QR में Student ID नहीं मिली!");
                }
            } catch (e) {
                alert("यह सही वेरिफिकेशन QR नहीं है।");
            }
        });
    };

    const config = { fps: 15, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
    .catch((err) => {
        // अगर कैमरा नहीं खुलता, तो बटन को वापस 'Enable' करें
        alert("कैमरा एक्सेस नहीं मिला!");
        readerDiv.style.display = 'none';
        if(scanBtn) {
            scanBtn.style.opacity = "1";
            scanBtn.style.pointerEvents = "auto";
        }
    });
}

// 2. स्कैन होने के बाद डेटा लोड करने वाला फंक्शन
async function autoFetchQRResult(sid) {
    if (typeof showLoading === "function") showLoading(true);
    try {
        const response = await fetch(`${SCRIPT_URL}?Action=VERIFY&StudentID=${sid}`);
        const result = await response.json();
        
        if (result.Success) {
            fetchedData = result.Data;
            // यह आपके द्वारा मांगी गई तीसरी फोटो (Verified Record) दिखाएगा
            showFinalResult(); 
        } else {
            alert("डेटाबेस में कोई रिकॉर्ड नहीं मिला!");
        }
    } catch (e) {
        alert("सर्वर से संपर्क नहीं हो पाया!");
    } finally {
        if (typeof showLoading === "function") showLoading(false);
    }
}
</script>
